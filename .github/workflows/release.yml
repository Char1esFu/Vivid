name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_date: ${{ steps.release.outputs.release_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: release
        name: Read tag metadata
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          release_date="$(git show -s --format=%cs "${GITHUB_SHA}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_date=${release_date}" >> "${GITHUB_OUTPUT}"

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VIVID_BUILD_ARCH: ${{ matrix.arch }}
      VIVID_CMAKE_BUILD_TYPE: Release
      VIVID_FLATPAK_APP_VERSION: ${{ needs.metadata.outputs.version }}
      VIVID_FLATPAK_RELEASE_DATE: ${{ needs.metadata.outputs.release_date }}
      VIVID_FLATPAK_GIT_BRANCH: ${{ github.ref_name }}
      VIVID_FLATPAK_GIT_COMMIT: ${{ github.sha }}
      VIVID_FLATPAK_CCACHE: "0"
      VIVID_FLATPAK_KEEP_BUILD_DIRS: "0"
      VIVID_FLATPAK_FORCE_CLEAN: "1"
      VIVID_FLATPAK_DISABLE_ROFILES_FUSE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak bundle
        run: tools/vivid.sh flatpak build
      - name: Verify scene release configuration
        shell: bash
        run: |
          ROOT_DIR="${GITHUB_WORKSPACE}/producer"
          source tools/producer/build_env.sh
          python3 - "${VIVID_FLATPAK_NATIVE_BUILD_ROOT}/scene" <<'PY'
          import json
          import pathlib
          import sys

          build = pathlib.Path(sys.argv[1])
          cache = {}
          for line in (build / "CMakeCache.txt").read_text().splitlines():
              if line and not line.startswith(("#", "//")) and "=" in line:
                  key, value = line.split("=", 1)
                  cache[key.split(":", 1)[0]] = value
          expected = {
              "CMAKE_BUILD_TYPE": "Release",
              "VIVID_BUILD_SCENE_CAPTURE": "OFF",
              "BUILD_TESTING": "OFF",
          }
          for key, value in expected.items():
              if cache.get(key) != value:
                  sys.exit(f"Release scene configuration mismatch: {key}={cache.get(key)!r}")

          commands = json.loads((build / "compile_commands.json").read_text())
          excluded = {"Diagnostics.cpp", "FrameTraceDump.cpp", "GpuPassProfiler.cpp"}
          for entry in commands:
              if pathlib.Path(entry["file"]).name in excluded:
                  sys.exit(f"Release compiles diagnostic source: {entry['file']}")
          for name in ("VulkanRender.cpp", "ShaderDrawCore.cpp", "WPSceneScriptHost.cpp",
                       "vivid_scene_producer.cpp", "vivid_scene_renderer_main.cpp"):
              command = next(e["command"] for e in commands if pathlib.Path(e["file"]).name == name)
              for flag in ("-DWESCENE_ENABLE_DIAGNOSTICS=0",
                           "-DSPDLOG_ACTIVE_LEVEL=SPDLOG_LEVEL_WARN"):
                  if flag not in command:
                      sys.exit(f"Release policy missing from {name}: {flag}")

          # Check the built worker as well as the requested configuration. Development input
          # names must disappear with their readers, serializers and profiler implementation.
          worker = (build / "out/vivid-scene-renderer").read_bytes()
          for marker in (b"WESCENE_TRACE_", b"WESCENE_DUMP_FRAME_TRACE", b"WESCENE_LOCKSTEP",
                         b"WESCENE_FIXED_", b"WESCENE_RANDOM_SEED", b"WESCENE_VK_VALIDATION",
                         b"VIVID_GPU_PROFILE"):
              if marker in worker:
                  sys.exit(f"Release scene worker contains diagnostic input: {marker.decode()}")
          print("Scene release configuration verified; diagnostic inputs are absent.")
          PY
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: vivid-flatpak-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          path: producer/.build/io.github.ayasa520.Vivid-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  gnome:
    name: GNOME consumer (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      DEBIAN_FRONTEND: noninteractive
      VIVID_BUILD_ARCH: ${{ matrix.arch }}
      VIVID_CONSUMER_PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Update package metadata
        run: apt-get update
      - name: Install build dependencies
        run: >-
          apt-get install -y --no-install-recommends
          ca-certificates git gcc meson ninja-build pkg-config
          libglib2.0-dev libjson-glib-dev libgtk-4-dev libdrm-dev
          libvulkan-dev gobject-introspection libgirepository1.0-dev
          gnome-shell
      - uses: actions/checkout@v4
      - name: Build GNOME consumer
        run: tools/vivid.sh gnome zip
      - name: Upload GNOME consumer
        uses: actions/upload-artifact@v4
        with:
          name: vivid-consumer-gnome-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          path: consumer/gnome/.build/dist/vivid-consumer-gnome-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  kde:
    name: KDE consumer (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    # Keep the libc baseline independent of the Qt SDK used for the plugin.
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    env:
      DEBIAN_FRONTEND: noninteractive
      QT_VERSION: 6.8.3
      KDE_DEPS_PREFIX: ${{ github.workspace }}/consumer/kde/.build/dependencies/prefix
      VIVID_BUILD_ARCH: ${{ matrix.arch }}
      VIVID_CONSUMER_PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Update Ubuntu package metadata
        run: apt-get update
      - name: Install build dependencies
        run: >-
          apt-get install -y --no-install-recommends
          ca-certificates git g++ cmake ninja-build pkg-config python3 python3-venv
          libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libegl1
          libopengl-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libwayland-dev libxcb1-dev libxcb-randr0-dev
          libxcb-dpms0-dev libxkbcommon-dev
          libglvnd-dev libgbm-dev libpulse-dev libvulkan-dev
      - uses: actions/checkout@v4
      - name: Prepare Qt 6.8 SDK
        shell: bash
        run: |
          sdk_dir="${GITHUB_WORKSPACE}/consumer/kde/.build/Qt"
          python3 -m venv "${sdk_dir}/aqt"
          cd "${sdk_dir}"
          "${sdk_dir}/aqt/bin/pip" install --disable-pip-version-check aqtinstall==3.3.0
          # The complete base SDK includes ICU, whose ABI can differ from the
          # build distribution. Do not filter its archives to Qt modules alone.
          "${sdk_dir}/aqt/bin/aqt" install-qt "${{ matrix.qt_host }}" desktop "${QT_VERSION}" \
            "${{ matrix.qt_arch }}" --outputdir "${sdk_dir}"
          # SDK architecture identifiers are not installation directory names.
          # Resolve the installed tool and verify it before exporting its paths.
          shopt -s nullglob
          qmake_paths=("${sdk_dir}/${QT_VERSION}/"*/bin/qmake)
          test "${#qmake_paths[@]}" -eq 1
          qt_root="$(cd "$(dirname "${qmake_paths[0]}")/.." && pwd)"
          installed_version="$(LD_LIBRARY_PATH="${qt_root}/lib" "${qt_root}/bin/qmake" -query QT_VERSION)"
          printf 'Qt SDK: %s (Qt %s)\n' "${qt_root}" "${installed_version}"
          test "${installed_version}" = "${QT_VERSION}"
          printf 'QT_ROOT=%s\nCMAKE_PREFIX_PATH=%s:%s\nLD_LIBRARY_PATH=%s/lib:%s/lib\n' \
            "${qt_root}" "${KDE_DEPS_PREFIX}" "${qt_root}" \
            "${KDE_DEPS_PREFIX}" "${qt_root}" >> "${GITHUB_ENV}"
          echo "${qt_root}/bin" >> "${GITHUB_PATH}"
      - name: Build KScreen with the release SDK
        shell: bash
        run: |
          # Build KScreen with the consumer's SDK so a rolling binary repository
          # cannot silently raise the runtime Qt requirement. Keep all build
          # dependencies local; the wallpaper uses the desktop's runtime libraries.
          build_root="${GITHUB_WORKSPACE}/consumer/kde/.build/dependencies"
          build_dependency() {
            local name="$1" repository="$2" revision="$3"
            local source_dir="${build_root}/${name}"
            git init "${source_dir}"
            git -C "${source_dir}" fetch --depth 1 "${repository}" "${revision}"
            git -C "${source_dir}" checkout --detach FETCH_HEAD
            test "$(git -C "${source_dir}" rev-parse HEAD)" = "${revision}"
            cmake -S "${source_dir}" -B "${source_dir}/.build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_QCH=OFF \
              -DCMAKE_INSTALL_PREFIX="${KDE_DEPS_PREFIX}" -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build "${source_dir}/.build" --parallel 2
            cmake --install "${source_dir}/.build"
          }
          # ECM 6.10.0, Plasma Wayland Protocols 1.16.0, and KScreen 6.3.6.
          build_dependency ecm https://invent.kde.org/frameworks/extra-cmake-modules.git \
            7dd28cc56c339c3f8fb356f7c53c0e8f61433d81
          build_dependency protocols https://invent.kde.org/libraries/plasma-wayland-protocols.git \
            3d8327f5c8727702c5b14730c32d70b30e2ae106
          build_dependency libkscreen https://invent.kde.org/plasma/libkscreen.git \
            21807e39fe6898a98a8e2e10eac0292fd09d5544
      - name: Build KDE consumer
        run: tools/vivid.sh kde zip
      - name: Upload KDE consumer
        uses: actions/upload-artifact@v4
        with:
          name: vivid-consumer-kde-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          path: consumer/kde/.build/dist/vivid-consumer-kde-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  layer-shell:
    name: Layer-shell consumer (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    container: almalinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VIVID_BUILD_ARCH: ${{ matrix.arch }}
      VIVID_CONSUMER_PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
      PYTHON: python3.11
    steps:
      - name: Enable AlmaLinux build repository
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
      - name: Install build dependencies
        run: >-
          dnf install -y
          git gcc cmake ninja-build meson pkgconf-pkg-config
          wayland-devel libglvnd-devel mesa-libEGL-devel mesa-libgbm-devel
          vulkan-headers vulkan-loader-devel python3.11 curl tar xz
      - uses: actions/checkout@v4
      - name: Build layer-shell consumer
        run: tools/vivid.sh layer-shell release
      - name: Upload layer-shell consumer
        uses: actions/upload-artifact@v4
        with:
          name: vivid-layer-shell-consumer-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          path: consumer/layer-shell/.build/dist/vivid-layer-shell-consumer-${{ needs.metadata.outputs.version }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - flatpak
      - gnome
      - kde
      - layer-shell
    runs-on: ubuntu-24.04
    steps:
      # `--notes-from-tag` reads the tag from the checked-out Git repository.
      # Keep release creation repository-local so gh does not reject the
      # unsupported combination of `--repo` and `--notes-from-tag`.
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          # Explicitly select the tag ref so checkout keeps its annotation. The
          # event's default SHA names the peeled commit; checkout can otherwise
          # fetch that commit into the local tag ref after fetching all tags.
          # gh reads the annotation below to populate the release notes.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-from-tag
